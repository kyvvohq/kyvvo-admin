name: Deploy to EC2

# DORMENTE — só `workflow_dispatch` por enquanto (Fase 0 do plano kyvvo-admin).
# O push trigger em `release` entra na Fase 1, quando o container `kyvvo-admin`
# existir no compose da EC2 e os params SSM `/kyvvo/admin/*` estiverem criados.
# Padrão: scp pra /opt/kyvvo/admin + gen-env-from-ssm.sh + docker compose up -d
# --force-recreate kyvvo-admin.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar chave SSH
        id: sshkey
        run: |
          KEY="$(printf '%s' '${{ secrets.EC2_SSH_KEY_B64 }}' | base64 -d)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo 'value<<KEYEOF'
            printf '%s\n' "$KEY"
            echo 'KEYEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Gravar versão do deploy
        run: |
          COMMIT_CURTO="${GITHUB_SHA::7}"
          echo "{\"commit\":\"${COMMIT_CURTO}\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json

      # O container de produção só roda `npm install --omit=dev && node
      # index.js` (ver kyvvo-infra/docker-compose.yml) — não tem toolchain
      # pra buildar o Vite ali. O build do piloto React (web/) acontece
      # aqui, e o resultado (public/app/**) viaja no mesmo scp de public/**
      # abaixo, como qualquer outro arquivo estático.
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build web/ (piloto React)
        run: npm --prefix web ci && npm --prefix web run build

      - name: Copiar arquivos pra EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          source: ".npmrc,index.js,package.json,package-lock.json,version.json,lib/**,routes/**,public/**,db/**"
          target: "/opt/kyvvo/admin"

      # Health check (2026-09-25): sem isso, "o deploy rodou" só confirmava
      # que o container foi recriado, nunca que o npm install/app dentro
      # dele realmente subiu — cada checagem precisava de um round-trip
      # manual no CloudShell (docker logs + curl). Agora falha o job (com
      # os logs já impressos aqui) se /health não responder em ~30s.
      - name: Regenerar env do SSM + recriar container + checar saúde
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          script: |
            set -e
            sudo /opt/kyvvo/scripts/gen-env-from-ssm.sh
            cd /opt/kyvvo && sudo docker compose up -d --force-recreate kyvvo-admin
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3004/health > /dev/null; then
                echo "OK: /health respondeu na tentativa ${i} (~$((i * 2))s)."
                exit 0
              fi
              sleep 2
            done
            echo "::error::/health não respondeu depois de ~30s — logs do container:"
            sudo docker logs kyvvo-kyvvo-admin-1 --tail 80
            exit 1
