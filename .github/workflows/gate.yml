name: Gate

# labeled/unlabeled entram para que aplicar (ou tirar) o selo 'revisado:infra'
# re-rode o gate sem precisar de um commit vazio.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Só existe desde que este repo ganhou migration própria (db/001, ver
    # lib/db.js) — antes disso, todo o schema de public.* vinha migrado
    # via kyvvo-studio, sem nenhum Postgres neste gate.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/admin_test
      NODE_ENV: test
      ADMIN_JWT_SECRET: test-secret
      # O .npmrc versionado expande ${NPM_PACKAGES_TOKEN}; sem ele no env o
      # npm.pkg.github.com dá E401. NODE_AUTH_TOKEN é o que o setup-node usa.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@kyvvohq"

      - name: Instalar dependências
        run: npm ci

      # Roda o runner real (@kyvvohq/db-migrate via lib/db.js) contra o
      # Postgres efêmero — aplica db/*.sql do zero, sozinho (sem o schema
      # do kyvvo-studio por perto, ver comentário em db/001 sobre não usar
      # FK pra kyvvo_admins).
      - name: Aplicar migrations do zero
        run: node -e "require('./lib/db').migrar().then(() => { console.log('migrations ok'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); })"

      - name: Testes unitários
        run: npm test

      - name: Build web/ (piloto React)
        run: npm --prefix web ci && npm --prefix web run build

      - name: node -c em todos os .js
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node -c

  # Barra PR que toca infra/CI/auth sem selo humano. Dependabot fica de fora.
  caminhos-protegidos:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Exigir label 'revisado:infra' para mexer em caminho protegido
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          case " $LABELS " in
            *" revisado:infra "*)
              echo "PR carrega o selo 'revisado:infra' — liberado."
              exit 0 ;;
          esac
          PROTEGIDOS='^(\.github/workflows/|\.github/dependabot\.yml|\.github/CODEOWNERS|CLAUDE\.md|Dockerfile|\.npmrc|package\.json|lib/|routes/admin-auth\.js)'
          MUDOU=$(git diff --name-only "$BASE" "$HEAD" | grep -E "$PROTEGIDOS" || true)
          if [ -n "$MUDOU" ]; then
            echo "::error::PR toca caminho protegido sem a label 'revisado:infra'."
            echo "Arquivos:"
            echo "$MUDOU" | sed 's/^/  - /'
            echo
            echo "Se a mudança é intencional e foi revisada por um humano,"
            echo "aplique a label 'revisado:infra' na PR e rode o gate de novo."
            exit 1
          fi
          echo "Nenhum caminho protegido tocado."
