name: Gate

# labeled/unlabeled entram para que aplicar (ou tirar) o selo 'revisado:infra'
# re-rode o gate sem precisar de um commit vazio.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      ADMIN_JWT_SECRET: test-secret
      # O .npmrc versionado expande ${NPM_PACKAGES_TOKEN}; sem ele no env o
      # npm.pkg.github.com dá E401. NODE_AUTH_TOKEN é o que o setup-node usa.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@kyvvohq"

      # `npm install` e não `npm ci` temporariamente: a Fase 1 trouxe deps
      # @kyvvohq/* (asaas, design-system) e o package-lock.json ainda não foi
      # gerado com um token read:packages. Rodar o workflow "Regenerar
      # package-lock" e voltar pra `npm ci` quando o lock entrar.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Testes unitários
        run: npm test

      - name: node -c em todos os .js
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node -c

  # Barra PR que toca infra/CI/auth sem selo humano. Dependabot fica de fora.
  caminhos-protegidos:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exigir label 'revisado:infra' para mexer em caminho protegido
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          case " $LABELS " in
            *" revisado:infra "*)
              echo "PR carrega o selo 'revisado:infra' — liberado."
              exit 0 ;;
          esac
          PROTEGIDOS='^(\.github/workflows/|\.github/dependabot\.yml|\.github/CODEOWNERS|CLAUDE\.md|Dockerfile|\.npmrc|package\.json|lib/|asaas-service\.js|meta-whatsapp-service\.js|routes/admin-auth\.js)'
          MUDOU=$(git diff --name-only "$BASE" "$HEAD" | grep -E "$PROTEGIDOS" || true)
          if [ -n "$MUDOU" ]; then
            echo "::error::PR toca caminho protegido sem a label 'revisado:infra'."
            echo "Arquivos:"
            echo "$MUDOU" | sed 's/^/  - /'
            echo
            echo "Se a mudança é intencional e foi revisada por um humano,"
            echo "aplique a label 'revisado:infra' na PR e rode o gate de novo."
            exit 1
          fi
          echo "Nenhum caminho protegido tocado."
