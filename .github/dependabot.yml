version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # @kyvvohq/* são internos (GitHub Packages privado), versionados por tag.
    ignore:
      - dependency-name: "@kyvvohq/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
